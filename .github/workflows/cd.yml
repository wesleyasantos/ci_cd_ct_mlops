name: CD

# Entrega Contínua: ao criar uma tag de versão (v1.0.0), roda o CI, constrói a imagem Docker
# com o modelo campeão, faz um teste de fumaça no container e publica no GitHub Container Registry.
# A tag pode ser criada por uma pessoa ou pelo CT, no modo de promoção automática (o CT dispara este
# workflow manualmente sobre a nova tag, porque eventos criados pelo GITHUB_TOKEN não disparam outros).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Rodar o CI antes de publicar
    uses: ./.github/workflows/ci.yml

  publicar:
    name: Construir, testar e publicar a imagem
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # necessário para publicar no ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Conferir que o modelo campeão está no repositório
        run: test -f models/champion/model.joblib

      - uses: docker/setup-buildx-action@v3

      - name: Metadados da imagem (nome e tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Construir a imagem (somente local, para o teste)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mlops-demo:teste
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Teste de fumaça do container
        run: |
          docker run -d --name api -p 8000:8000 mlops-demo:teste
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && break
            sleep 1
          done
          python3 demo/smoke_test.py http://localhost:8000

      - name: Logs do container (se algo falhou)
        if: failure()
        run: docker logs api

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
